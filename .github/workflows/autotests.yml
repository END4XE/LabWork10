name: .NET Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - '**/*.cs'
      - '.github/workflows/autotests.yml'
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with code coverage
        run: dotnet tests --no-build -- configuration Release --logger "trx;LogFileName=test_result.trx --collect:XPlat Code Coverage"

      - name: Test Report 
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with: 
          name: Test results
          path: "**/*.trx"
          reporter: dotnet-trx

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Code Coverage Report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artefact@v4
        with:
          name: CodeCoverageReport
          path: coveragereport